<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Subscriptions Catalog - ELite Subscriptions</title>
  <meta name="description" content="Browse all available official subscriptions: ChatGPT Plus, Claude Pro, Gemini, Netflix, Canva, Copilot and more.">
  
  <link rel="icon" type="image/png" href="assets/logo-icon-transparent.png">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LiteAPKs Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#fbfbfb] text-[#202124] antialiased">

  <!-- Universal Navbar -->
  <div id="universal-navbar"></div>

  <!-- Main Content -->
  <main class="py-6 sm:py-8 pb-16 md:pb-8">
    <div class="max-w-gp mx-auto px-4 md:px-6">

      <!-- Controls & Search Card (LiteAPKs Style) -->
      <div class="bg-white p-4 rounded-2xl border border-border shadow-sm mb-6 space-y-3.5">
        
        <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
          <!-- Search Input Pill -->
          <div class="search-input-pill flex-1">
            <svg class="w-4 h-4 text-gray-3 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input 
              type="text" 
              id="catalog-search-input" 
              placeholder="Search apps & services (e.g. ChatGPT, Netflix, Canva, Copilot)..."
              autocomplete="off"
            >
          </div>

          <!-- Sort Select Dropdown -->
          <div class="flex items-center gap-2 shrink-0">
            <label for="catalog-sort-select" class="text-xs font-bold text-gray-3 uppercase tracking-wider">Sort by:</label>
            <select id="catalog-sort-select" class="text-xs font-bold text-dark bg-gray-50 border border-border rounded-xl px-3 py-2 outline-none focus:border-primary transition-colors">
              <option value="featured">Featured / Top Picks</option>
              <option value="rating">Highest Rated (5.0 ★)</option>
              <option value="name">Alphabetical (A - Z)</option>
            </select>
          </div>
        </div>

        <!-- LiteAPKs Category Filter Pills -->
        <div class="pt-2 border-t border-border flex items-center gap-2 overflow-x-auto pb-1 hide-sb" id="category-tabs">
          <!-- Populated dynamically by app.js -->
        </div>

      </div>

      <!-- Catalog Live Meta & Status -->
      <div class="flex items-center justify-between mb-4 px-1 text-xs">
        <span id="product-count-display" class="font-extrabold text-gray uppercase tracking-wider">
          Loading subscriptions...
        </span>
        <span class="text-primary font-bold flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
          All Digital Accounts In Stock & Active
        </span>
      </div>

      <!-- Catalog Products Grid (LiteAPKs App List Cards) -->
      <div id="catalog-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5">
        <!-- Populated dynamically by app.js -->
      </div>

      <!-- No Results State -->
      <div id="catalog-no-results" class="hidden text-center py-16 bg-white rounded-2xl border border-border shadow-sm my-6">
        <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-3 text-gray-3">
          <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <h3 class="font-extrabold text-dark text-base">No matching subscriptions found</h3>
        <p class="text-xs text-gray mt-1 max-w-sm mx-auto">
          We couldn't find anything matching your search. Try checking your spelling or explore another category.
        </p>
        <a href="catalog.html" class="inline-block mt-4 btn-install text-xs py-2 px-4 max-w-[180px] mx-auto">
          Reset Filter
        </a>
      </div>

    </div>
  </main>

  <!-- Universal Footer -->
  <div id="universal-footer"></div>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
